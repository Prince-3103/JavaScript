<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Notes</title>
    <link rel="stylesheet" href="style.css">
    <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
    rel="stylesheet"
    />
</head>
<body>

    <!-- FORM -->
    <div class="form-container hidden">
        <form>
            <h2>New Call</h2>

            <label>Image URL</label>
            <input autocomplete="off" required id="image-url" type="text" placeholder="https://example.com/photo.jpg">

            <label>Full Name</label>
            <input autocomplete="off" required id="full-name" type="text" placeholder="Enter full name">

            <label>Home Town</label>
            <input autocomplete="off" required id="home-town" type="text" placeholder="Enter home town">

            <label>Purpose</label>
            <input autocomplete="off" required id="purpose" type="text" placeholder="e.g. Quick appointment note">
            
            <label>Category</label>
            <label class="tag-checkbox">
                <input required type="radio" name="category" value="emergency">
                <span>Emergency</span>
            </label>
            <label class="tag-checkbox">
                <input type="radio" name="category" value="important">
                <span>Important</span>
            </label>
            <label class="tag-checkbox">
                <input type="radio" name="category" value="urgent">
                <span>Urgent</span>
            </label>
            <label class="tag-checkbox">
                <input type="radio" name="category" value="no-rush">
                <span>No Rush</span>
            </label>

            <!-- <div class="category-wrapper">
                <button class="priority emergency">Emergency</button>
                <button class="priority important">Important</button>
                <button class="priority urgent">Urgent</button>
                <button class="priority no-rush">No Rush</button>
            </div> -->
            
            <button id="create-note">Create Note</button>

            <button id="close-form">
                Close
            </button>
        </form>
    </div>


    <!-- NOTES SECTION -->
    <div class="note-container">

        <!-- LEFT ICONS -->
        <div class="left-icons">

            <button id="add-btn"><i class="ri-add-line"></i></button>

            <button id="up-btn"><i class="ri-arrow-up-long-fill"></i></button>

            <button id="down-btn"><i class="ri-arrow-down-long-fill"></i></button>

        </div>


        <!-- STACK -->

        <!-- PRIORITY COLORS -->
        <div class="right-colors">

            <div class="dot black"></div>
            <div class="dot purple"></div>

            <div class="dot green"></div>

        </div>

    </div>

    <script src="script.js"></script>
</body>
