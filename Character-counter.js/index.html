<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number of Character</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body{
            width: 100%;
            height: 100%;
            background-color: #555;
        }
        #main{
            width: 100%;
            height: 100%;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        input{
            padding: 7px;
            border: 1px solid black;
            border-radius: 8px;
            width: 200px;
        }
        h2{
            margin-top: 20px;
            flex-wrap: nowrap;
        }
    </style>
</head>
<body>
    <div id="main">
        <input type="text" placeholder="Enter word">
        <h2>Total Character: <span>0</span></h2>
        <h3>Character Left: <span class="limit">20</span></h3>
    </div>
    <script src="script.js"></script>
</body>
</html>
